<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 관리 — 위아짐 체크데이</title>
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/font.css" />
    <link rel="stylesheet" href="styles/layout-shell.css" />
    <link rel="stylesheet" href="styles/layout-members.css" />
  </head>
  <body>
    <!-- 파일 용도: 회원 관리 화면 — 회원 목록·검색·생성·제거 (mock 데이터) -->
    <div class="container">
      <app-header logout crumb="회원 관리">
        <!-- 네비게이션 삭제 -->
        <!-- <app-gnb active="members"></app-gnb> -->
        <app-help>
          <h4>회원 관리</h4>
          <p>
            회원 행을 클릭하면 상세 화면으로 이동합니다. 제거 버튼은 즉시
            목록에서 삭제합니다.
          </p>
        </app-help>
      </app-header>

      <main>
        <!-- 검색 -->
        <section class="member-toolbar">
          <input
            id="search-input"
            class="member-search"
            type="search"
            placeholder="회원 이름으로 검색"
            aria-label="회원 이름 검색"
          />
          <a class="btn btn-primary" href="member-create.html"
            >＋ 회원 정보 생성</a
          >
          <span
            class="member-count"
            id="member-count"
            aria-live="polite"
          ></span>
        </section>

        <!-- 목록 (컴포넌트가 테이블 렌더링) -->
        <member-table id="member-table"></member-table>
        <p class="member-empty" id="member-empty" hidden>
          등록된 회원이 없습니다.
        </p>
      </main>
    </div>

    <script type="module" src="scripts/members.js"></script>
  </body>
</html>
