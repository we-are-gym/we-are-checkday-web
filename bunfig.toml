# bun 설정 — 테스트 및 개발 환경
# 파일 용도: bun test 커버리지 설정
[test]
coverage = true
coverageDir = "coverage"
# bun test가 스캔할 루트 디렉토리 — __e2e__/의 Playwright 테스트를 제외
root = "__tests__/"

[resolve]
"@infra/*" = "./ESM/infra/*"
"@tools/*" = "./ESM/tools/*"
"@calc/*" = "./ESM/calc/*"
"@gym/*" = "./ESM/gym/*"
"@member/*" = "./ESM/member/*"
"@check-doc/*" = "./ESM/check-doc/*"
"@shared/*" = "./ESM/shared/*"
# EOF
