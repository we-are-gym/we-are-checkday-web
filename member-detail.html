<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 상세 — 위아짐 체크데이</title>
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/font.css" />
    <link rel="stylesheet" href="styles/layout-shell.css" />
    <link rel="stylesheet" href="styles/layout-member-detail.css" />
    <style type="text/css">
      #new-record-btn {
        border: solid 0.5px #3a3a3a;
        color: var(--text2);
        background: none;
      }

      #new-record-btn:hover {
        color: var(--text);
        background: var(--surface2);
      }
    </style>
  </head>

  <body>
    <!-- 파일 용도: 회원 상세 조회 및 체크기록 비교 — ?memberID= 로 회원을 조회한다 -->
    <div class="container">
      <app-header logout crumb="회원 관리">
        <!-- 네비게이션 삭제 -->
        <!-- <app-gnb active="members"></app-gnb> -->
        <!-- 내장 도움말 삭제 -->
        <!-- <app-help>
          <h4>회원 상세</h4>
          <p>
            회원 정보 카드에서 이름·성별·담당 트레이너·운동 목표를 확인합니다.
          </p>
          <p>
            체크 기록 탭: 회차별 기록 목록. 변화 분석 탭: 두 회차의
            인바디·움직임 점수를 비교합니다.
          </p>
        </app-help> -->
      </app-header>

      <main>
        <!-- 페이지 머리 (프로토타입 배치) — 회원 이름 + 기록 건수 + 편집 버튼 -->
        <div class="page-head">
          <div>
            <div class="page-title" id="md-title">―</div>
            <div class="page-sub" id="md-sub">―</div>
          </div>
          <a class="btn btn-ghost" id="edit-member-btn" href="#">편집</a>
        </div>

        <!-- 좌우 2단 컬럼 (프로토타입 two-col 배치) -->
        <div class="member-detail-layout">
          <!-- 좌측 스택: 회원 정보 + 통계(스파크라인) -->
          <div class="detail-aside">
            <!-- 회원 정보 카드 -->
            <section class="info-card" aria-label="회원 정보">
              <div class="info-row">
                <span class="info-label">이름</span
                ><span class="info-value" id="md-name">―</span>
              </div>
              <div class="info-row">
                <span class="info-label">성별</span
                ><span class="info-value" id="md-gender">―</span>
              </div>
              <div class="info-row">
                <span class="info-label">담당 트레이너</span
                ><span class="info-value" id="md-trainer">―</span>
              </div>
            </section>

            <!-- 통계 카드 (프로토타입 배치: 단일 카드 + chart-stat 4종 세로 누적) -->
            <section
              class="detail-card stat-card"
              aria-label="통계 · 전체 회차 누적"
            >
              <h2 class="stat-card-title">
                통계 &nbsp;
                <span
                  style="
                    font-size: 6.3px;
                    font-weight: normal;
                    color: var(--text3);
                  "
                >
                  <!-- · -->
                  전체 회차 누적</span
                >
              </h2>
              <div class="stat-charts" id="stat-charts"></div>
            </section>
          </div>

          <!-- 우측 스택: 탭 + 패널 -->
          <div class="detail-main">
            <!-- 탭 -->
            <div class="detail-tabs" role="tablist" aria-label="회원 상세 탭">
              <button
                class="tab-btn"
                role="tab"
                aria-selected="true"
                aria-controls="panel-records"
                id="tab-records"
                data-tab="records"
              >
                체크 기록
              </button>
              <button
                class="tab-btn"
                role="tab"
                aria-selected="false"
                aria-controls="panel-compare"
                id="tab-compare"
                data-tab="compare"
                tabindex="-1"
              >
                변화 분석
              </button>
            </div>

            <!-- 체크 기록 패널 -->
            <section
              id="panel-records"
              role="tabpanel"
              aria-labelledby="tab-records"
            >
              <div class="records-head">
                <h2 class="panel-title">
                  <!-- 체크 기록 -->
                </h2>
                <a
                  class="btn btn-primary btn-sm"
                  id="new-record-btn"
                  href="check-doc-new.html"
                >
                  ＋ 체크기록 작성
                </a>
              </div>
              <div class="record-list" id="record-list"></div>
            </section>

            <!-- 변화 분석 패널 -->
            <section
              id="panel-compare"
              role="tabpanel"
              aria-labelledby="tab-compare"
              hidden
            >
              <!-- 비교 선택 (프로토타입: 카드 + 2열 그리드) -->
              <div class="detail-card compare-controls">
                <label class="compare-field">
                  <span>현재 체크기록</span>
                  <select id="cmp-cur" aria-label="현재 체크기록 선택"></select>
                </label>
                <label class="compare-field">
                  <span>비교 대상</span>
                  <select id="cmp-tgt" aria-label="비교 대상 선택"></select>
                </label>
              </div>
              <!-- 비교 결과 (프로토타입: 카드 안 인바디 표 + 움직임 평가 총점 표) -->
              <div class="detail-card compare-result" id="compare-result"></div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="scripts/member-detail.js"></script>
  </body>
</html>
