<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="images/favicon.ico?v=2026081815" />
		<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png?v=2026081815" />
		<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=2026081815" />
		<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180x180.png?v=2026081815" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="회원 상세 — 위아짐 체크데이" />
		<meta property="og:description" content="그룹 트레이닝 격월 점검 · 회원별 움직임 평가와 상담 관리" />
		<meta property="og:image" content="images/og-image.png?v=2026081815" />
		<meta property="og:url" content="member-detail.html" />
		<title>회원 상세 — 위아짐 체크데이</title>
		<link rel="stylesheet" href="styles/colors.css?v=2026081815" />
		<link rel="stylesheet" href="styles/font.css?v=2026081815" />
		<link rel="stylesheet" href="styles/layout-shell.css?v=2026081815" />
		<link rel="stylesheet" href="styles/layout-member-detail.css?v=2026081815" />
		<link rel="stylesheet" href="styles/print-member-detail.css?v=2026081815" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
	</head>

	<body>
		<!-- 파일 용도: 회원 상세 조회 및 체크기록 비교 — ?memberID= 로 회원을 조회한다 -->
		<div class="container">
			<app-header crumb-path="index.html>홈|members.html>회원 관리|회원 정보"> </app-header>

			<main>
				<!-- 페이지 머리 — 회원 이름 + 기록 건수 + 편집 버튼 + PNG 내보내기 -->
				<div class="page-head">
					<div>
						<div class="page-title" id="md-title" aria-live="polite">―</div>
						<div class="page-sub" id="md-sub">―</div>
					</div>
					<div class="no-print" style="display: flex; gap: 8px; align-items: center">
						<a class="btn btn-ghost" id="edit-member-btn" href="#">편집</a>
						<button type="button" class="btn btn-ghost" id="export-png-btn" aria-label="회원 정보를 PNG 파일로 내보내기">
							이미지 저장
						</button>
						<button type="button" class="btn btn-ghost" id="print-pdf-btn" aria-label="회원 정보를 PDF로 인쇄">
							PDF 인쇄
						</button>
					</div>
				</div>

				<!-- 인쇄 전용 회원 이름 표시 (page-head 숨김 시 대체) -->
				<div class="print-only" style="margin-bottom: 4px;">
					<div class="page-title" id="md-name-print"></div>
				</div>

				<!-- 좌우 2단 컬럼 (two-col 배치) -->
				<div class="member-detail-layout">
					<!-- Caution: 체지방률은 퍼센트를 변화의 단위로 삼지 않습니다. 대신 퍼센트포인트를 변화의 단위로 삼습니다. -->

					<!-- 좌측 스택: 회원 정보 + 통계(스파크라인) -->
					<div class="detail-aside">
						<!-- 회원 정보 카드 -->
						<section class="info-card" aria-label="회원 정보">
							<div class="info-row"><span class="info-label">이름</span><span class="info-value" id="md-name">―</span></div>
							<div class="info-row"><span class="info-label">성별</span><span class="info-value" id="md-gender">―</span></div>
							<div class="info-row">
								<span class="info-label">담당 트레이너</span><span class="info-value" id="md-trainer">―</span>
							</div>
						</section>

						<!-- 통계 카드 (단일 카드 + chart-stat 4종 세로 누적) -->
						<section class="detail-card stat-card" aria-label="통계 · 전체 회차 누적">
							<h2 class="stat-card-title">
								통계 &nbsp;
								<span class="stat-card-title-note">전체 회차 누적</span>
							</h2>
							<div class="stat-charts" id="stat-charts"></div>
						</section>
					</div>

					<!-- 우측 스택: 탭 + 패널 -->
					<div class="detail-main">
						<!-- 탭 -->
						<div class="detail-tabs no-print" role="tablist" aria-label="회원 상세 탭">
							<button
								class="tab-btn"
								role="tab"
								aria-selected="true"
								aria-controls="panel-records"
								id="tab-records"
								data-tab="records"
							>
								체크 기록
							</button>
							<button
								class="tab-btn"
								role="tab"
								aria-selected="false"
								aria-controls="panel-compare"
								id="tab-compare"
								data-tab="compare"
								tabindex="-1"
							>
								변화 분석
							</button>
						</div>

						<!-- 체크 기록 패널 -->
						<section id="panel-records" role="tabpanel" aria-labelledby="tab-records">
							<div class="records-head">
								<h2 class="panel-title">
									<!-- 체크 기록 -->
								</h2>
								<a class="btn btn-primary btn-sm no-print" id="new-record-btn" href="check-doc-new.html"> ＋ 체크기록 작성 </a>
							</div>
							<div class="record-list" id="record-list" aria-live="polite"></div>
						</section>

						<!-- 변화 분석 패널 -->
						<section id="panel-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
							<!-- 비교 선택 (프로토타입: 카드 + 2열 그리드) -->
							<div class="detail-card compare-controls">
								<label class="compare-field">
									<span>비교 대상</span>
									<select id="cmp-cur" aria-label="비교 대상 체크기록 선택"></select>
								</label>
								<label class="compare-field">
									<span>현재 체크기록</span>
									<select id="cmp-tgt" aria-label="현재 체크기록 선택"></select>
								</label>
							</div>
							<!-- 비교 결과 (프로토타입: 카드 안 인바디 표 + 움직임 평가 총점 표) -->
							<div class="detail-card compare-result" id="compare-result" aria-live="polite" aria-atomic="true"></div>
						</section>
					</div>
				</div>
			</main>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@infra/": "./ESM/infra/",
					"@tools/": "./ESM/tools/",
					"@calc/": "./ESM/calc/",
					"@gym/": "./ESM/gym/",
					"@member/": "./ESM/member/",
					"@shared/": "./ESM/shared/",
					"@check-doc/": "./ESM/check-doc/"
				}
			}
		</script>
		<script type="module" src="ESM/entries/member-detail.js?v=2026081815"></script>
	</body>
</html>
