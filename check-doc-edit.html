<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체크기록 편집 — 위아짐 체크데이</title>
    <link rel="stylesheet" href="styles/colors.css?v=2026080520" />
    <link rel="stylesheet" href="styles/font.css?v=2026080520" />
    <link rel="stylesheet" href="styles/layout-shell.css?v=2026080520" />
    <link rel="stylesheet" href="styles/layout-checkday.css?v=2026080520" />
  </head>
  <body>
    <!-- 파일 용도: 체크기록 편집 화면 — ?docID= 기록을 불러와 인바디·움직임 평가·목표·피드백을 수정하고 저장한다 -->
    <div class="container">
      <app-header
        logout
        crumb-path="index.html>홈|members.html>회원 관리|체크기록 편집"
      >
        <!-- 네비게이션 삭제 -->
        <!-- <app-gnb></app-gnb> -->
        <!-- 내장 도움말 삭제 -->
        <!-- <app-help>
          <h4>체크기록 편집</h4>
          <p>
            저장된 기록 1건을 불러와 수정합니다. 인바디 수치·평가 점수(0–3)·체크
            항목·메모·목표·피드백을 고칠 수 있어요.
          </p>
          <p>수정 후 저장 버튼을 누르면 조회 화면으로 돌아갑니다.</p>
        </app-help> -->
      </app-header>

      <!-- 회원 정보 -->
      <div class="member-bar">
        <div class="mf">
          <label>회원 이름</label
          ><input id="m-name" type="text" placeholder="홍길동" />
        </div>
        <div class="mf">
          <label>회차</label
          ><input id="m-session" type="text" placeholder="2025-06 (2회차)" />
        </div>
        <div class="mf">
          <label>트레이너</label
          ><input id="m-trainer" type="text" placeholder="김지훈" />
        </div>
      </div>

      <!-- 움직임 총점 -->
      <div class="total-bar">
        <div class="tl">
          <div class="tl-label">움직임 총점</div>
          <div class="tl-num" id="total-num">0 <span>/ 24</span></div>
        </div>
        <div class="tr">
          <div class="prog-track">
            <div class="prog-fill" id="prog-fill"></div>
          </div>
          <div class="total-grade">
            <div class="grade-pill" id="grade-pill">평가 전</div>
            <span class="grade-hint" id="grade-hint"></span>
          </div>
        </div>
      </div>

      <!-- ① 인바디 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">1</div>
          <div class="sec-title">인바디 확인</div>
          <div class="sec-sub">체성분 수치 입력</div>
        </div>
        <div class="card">
          <div class="ib-grid" id="ib-grid"></div>
          <!-- 내장지방 -->
          <div class="ib-vis-row">
            <div class="ib-vis-field">
              <label class="ib-vis-label">내장지방 레벨</label>
              <input
                class="ib-num ib-vis-input"
                id="ib-vis"
                type="number"
                placeholder="8"
                min="1"
                max="20"
              />
            </div>
            <div id="tag-vis" class="tag-vis"></div>
          </div>
          <div class="ib-comment-row">
            <span class="ib-comment-lbl">코멘트</span>
            <textarea
              class="ib-comment"
              id="ib-comment"
              placeholder="지난 회차 대비 변화, 방향 코멘트 (예: 근육↑ 체지방↓ 유지 잘 됨)"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- ② 움직임 평가 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">2</div>
          <div class="sec-title">움직임 평가</div>
          <div class="sec-sub" id="eval-sec-sub">8개 항목 · 각 0–3점</div>
        </div>
        <div class="card" id="eval-cards"></div>
        <button type="button" class="add-eval-btn" id="add-eval-btn">
          + 평가 항목 추가
        </button>
      </div>

      <!-- ③ 다음 목표 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">3</div>
          <div class="sec-title">다음 목표 / 방향</div>
          <div class="sec-sub">태그 선택 + 메모</div>
        </div>
        <div class="card">
          <div class="goal-tags" id="goal-tags"></div>
          <div class="goal-memo-wrap">
            <input
              class="goal-custom"
              id="goal-custom"
              type="text"
              placeholder="추가 목표 (쉼표로 구분, 예: 체지방률 25% 이하, 골격근량 34kg)"
            />
            <textarea
              class="goal-memo"
              id="goal-memo"
              placeholder="구체적인 방향이나 다음 회차까지의 목표를 기록하세요..."
            ></textarea>
          </div>
        </div>
      </div>

      <!-- ④ 동작 피드백 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">4</div>
          <div class="sec-title">동작 피드백</div>
          <div class="sec-sub">동작 추가/삭제 가능</div>
        </div>
        <div class="card" id="fb-cards"></div>
        <button class="add-fb-btn">+ 동작 추가</button>
      </div>

      <!-- ⑤ 종합 상담 메모 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">5</div>
          <div class="sec-title">종합 상담 메모</div>
          <div class="sec-sub">특이사항 · 요청사항</div>
        </div>
        <div class="card">
          <textarea
            class="consult-memo"
            id="consult-memo"
            placeholder="부상 이력, 생활 패턴, 회원 요청, 다음 체크데이 주의사항 등..."
          ></textarea>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" id="btn-cancel" href="#">이전으로</a>
        <button class="btn btn-ghost" data-action="reset">초기화</button>
        <button class="btn btn-primary" data-action="save-edit">저장</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@base/": "./scripts/base/",
          "@member/": "./scripts/member/",
          "@check-doc/": "./scripts/check-doc/"
        }
      }
    </script>
    <script
      type="module"
      src="scripts/entries/check-doc-edit.js?v=2026080520"
    ></script>
  </body>
</html>
