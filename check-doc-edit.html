<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico?v=2026082311" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png?v=2026082311" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=2026082311" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180x180.png?v=2026082311" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="체크기록 편집 — 위아짐 체크데이" />
    <meta property="og:description" content="그룹 트레이닝 격월 점검 · 회원별 움직임 평가와 상담 관리" />
    <meta property="og:image" content="images/og-image.png?v=2026082311" />
    <meta property="og:url" content="check-doc-edit.html" />
    <title>체크기록 편집 — 위아짐 체크데이</title>
    <link rel="stylesheet" href="styles/colors.css?v=2026082311" />
    <link rel="stylesheet" href="styles/font.css?v=2026082311" />
    <link rel="stylesheet" href="styles/layout-shell.css?v=2026082311" />
    <link rel="stylesheet" href="styles/layout-checkday.css?v=2026082311" />
  </head>
  <body>
    <!-- 파일 용도: 체크기록 편집 화면 — ?docID= 기록을 불러와 인바디·움직임 평가·목표·피드백을 수정하고 저장한다 -->
    <div class="container">
      <app-header crumb-path="index.html>홈|members.html>회원 관리|체크기록 편집"> </app-header>

      <!-- 회원 정보 — 회원명은 회원 정보 화면에서 관리하므로 읽기전용, 상담일은 편집 가능 -->
      <div class="member-bar">
        <div class="mf"><label>회원 이름</label><input id="m-name" type="text" readonly aria-label="회원 이름" /></div>
        <div class="mf"><label>상담일</label><input id="m-date" type="date" aria-label="상담일" /></div>
        <div class="mf"><label>회차</label><input id="m-session" type="text" placeholder="2025-06 (2회차)" aria-label="회차" /></div>
        <div class="mf"><label>트레이너</label><input id="m-trainer" type="text" placeholder="정지훈" aria-label="담당 트레이너" /></div>
      </div>

      <!-- 움직임 총점 -->
      <div class="total-bar">
        <div class="tl">
          <div class="tl-label">움직임 총점</div>
          <div class="tl-num" id="total-num" aria-live="polite">0 <span>/ 24</span></div>
        </div>
        <div class="tr">
          <div class="prog-track">
            <div class="prog-fill" id="prog-fill"></div>
          </div>
          <div class="total-grade">
            <div class="grade-pill" id="grade-pill">평가 전</div>
            <span class="grade-hint" id="grade-hint"></span>
          </div>
        </div>
      </div>

      <!-- ① 인바디 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">1</div>
          <div class="sec-title">인바디 확인</div>
          <div class="sec-sub">체성분 수치 입력</div>
        </div>
        <div class="card">
          <div class="ib-grid" id="ib-grid"></div>
          <!-- 내장지방 -->
          <div class="ib-vis-row">
            <div class="ib-vis-field">
              <label class="ib-vis-label">내장지방 레벨</label>
              <input class="ib-num ib-vis-input" id="ib-vis" type="number" placeholder="8" min="1" max="20" />
            </div>
            <div id="tag-vis" class="tag-vis"></div>
          </div>
          <div class="ib-comment-row">
            <span class="ib-comment-lbl">코멘트</span>
            <textarea
              class="ib-comment"
              id="ib-comment"
              placeholder="지난 회차 대비 변화, 방향 코멘트 (예: 근육↑ 체지방↓ 유지 잘 됨)"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- ② 움직임 평가 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">2</div>
          <div class="sec-title">움직임 평가</div>
          <div class="sec-sub" id="eval-sec-sub">8개 항목 · 각 0–3점</div>
        </div>
        <div class="card" id="eval-cards"></div>
        <button type="button" class="add-eval-btn" id="add-eval-btn" aria-label="평가 항목 추가">+ 평가 항목 추가</button>
      </div>

      <!-- ③ 다음 목표 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">3</div>
          <div class="sec-title">다음 목표 / 방향</div>
          <div class="sec-sub">태그 선택 + 메모</div>
        </div>
        <div class="card">
          <div class="goal-tags" id="goal-tags"></div>
          <div class="goal-memo-wrap">
            <textarea class="goal-memo" id="goal-memo" placeholder="구체적인 방향이나 다음 회차까지의 목표를 기록하세요..."></textarea>
          </div>
        </div>
      </div>

      <!-- ④ 동작 피드백 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">4</div>
          <div class="sec-title">동작 피드백</div>
          <div class="sec-sub">동작 추가/삭제 가능</div>
        </div>
        <div class="card" id="fb-cards"></div>
        <button class="add-fb-btn" aria-label="동작 피드백 추가">+ 동작 추가</button>
      </div>

      <!-- ⑤ 종합 상담 메모 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">5</div>
          <div class="sec-title">종합 상담 메모</div>
          <div class="sec-sub">특이사항 · 요청사항</div>
        </div>
        <div class="card">
          <textarea
            class="consult-memo"
            id="consult-memo"
            placeholder="부상 이력, 생활 패턴, 회원 요청, 다음 체크데이 주의사항 등..."
          ></textarea>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" id="btn-cancel" href="#">이전으로</a>
        <button class="btn btn-ghost" data-action="reset">초기화</button>
        <button class="btn btn-primary" data-action="save">저장</button>
      </div>
    </div>

    <!-- 평가 항목 추가 피커 — 삭제된 베이직 평가 항목을 사용자가 직접 골라 다시 추가한다 -->
    <div class="overlay" id="eval-picker-overlay" role="dialog" aria-modal="true" aria-labelledby="eval-picker-title">
      <div class="modal">
        <h3 id="eval-picker-title">평가 항목 추가</h3>
        <p class="picker-hint">아래 후보 중 추가할 항목을 선택하세요. (사용 중인 항목은 제외)</p>
        <div class="picker-list" id="eval-picker-list"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-action="close-picker">닫기</button>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@infra/": "./ESM/infra/",
          "@tools/": "./ESM/tools/",
          "@calc/": "./ESM/calc/",
          "@gym/": "./ESM/gym/",
          "@member/": "./ESM/member/",
          "@shared/": "./ESM/shared/",
          "@check-doc/": "./ESM/check-doc/",
          "@types/": "./ESM/types/"
        }
      }
    </script>
    <script type="module" src="ESM/entries/check-doc-edit.js?v=2026082311"></script>
  </body>
</html>
