<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>위아짐 체크데이 - 화면 구성 프로토타입</title>
<style>
:root{
  color-scheme: dark;
  --bg:#131313;
  --surface:#1a1a1a;
  --surface-2:#212121;
  --border:#2a2a2a;
  --border-soft:#232323;
  --text:#f3f1ee;
  --text-dim:#9a9a9a;
  --text-faint:#5f5f5f;
  --logo-coral:#ff6f5e;
  --accent:#7CA463;
  --accent-hover:#6f9457;
  --accent-dim:rgba(124,164,99,0.14);
  --accent-text:#182015;
  --radius:10px;
  --font: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:15px; line-height:1.5;
}
.screen{display:none; min-height:100vh; padding-bottom:80px;}
.screen.active{display:block;}

/* ---------- topbar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 40px;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; cursor:pointer;}
.brand svg{display:block;}
.topbar-right{display:flex; align-items:center; gap:18px;}
.topbar-right .crumb{color:var(--text-dim); font-size:13px;}
.link-btn{
  background:none; border:none; color:var(--text-dim); font-size:13px;
  cursor:pointer; font-family:var(--font);
}
.link-btn:hover{color:var(--text);}

/* ---------- layout helpers ---------- */
.container{max-width:1040px; margin:0 auto; padding:40px;}
.container-narrow{max-width:420px; margin:0 auto; padding:40px 20px;}
.container-form{max-width:720px; margin:0 auto; padding:40px;}
.page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; gap:16px;}
.page-title{font-size:20px; font-weight:700;}
.page-sub{color:var(--text-dim); font-size:13px; margin-top:4px;}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--font); font-size:14px; border-radius:8px; cursor:pointer;
  padding:10px 18px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); transition:background .15s, border-color .15s;
}
.btn:hover{background:#272727; border-color:#3a3a3a;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:700;}
.btn-primary:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
.btn-ghost{background:none; border:1px solid var(--border); color:var(--text-dim);}
.btn-ghost:hover{color:var(--text); border-color:#3a3a3a;}
.btn-danger{background:none; border:1px solid var(--border); color:#c97a72;}
.btn-danger:hover{border-color:#c97a72;}
.btn-sm{padding:6px 12px; font-size:12.5px;}

/* ---------- main screen ---------- */
.main-wrap{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:calc(100vh - 73px); gap:8px;
}
.main-logo{margin-bottom:6px;}
.main-title{font-weight:700; font-size:22px; letter-spacing:0.3px; margin-bottom:36px;}
.main-actions{display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px;}
.main-actions .btn{
  width:100%; text-align:center; padding:14px 0; font-size:15px; font-weight:600;
  background:var(--surface); border:1px solid var(--border); color:var(--text);
}
.main-actions .btn:hover{background:var(--surface-2); border-color:#3a3a3a;}

/* ---------- login ---------- */
.login-wrap{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; gap:28px;
}
.login-form{display:flex; flex-direction:column; gap:10px; width:280px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; color:var(--text-dim);}
input[type=text], input[type=password], input[type=search], input[type=number], textarea, select{
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  color:var(--text); padding:10px 12px; font-family:var(--font); font-size:14px;
  width:100%;
}
input[readonly]{color:var(--text-dim);}
input:focus, textarea:focus, select:focus{outline:1px solid var(--accent); border-color:var(--accent);}
.login-form .btn-primary{margin-top:8px; padding:11px 0;}

/* ---------- table / list ---------- */
.toolbar{display:flex; gap:10px; margin-bottom:18px; align-items:center;}
.toolbar input[type=search]{max-width:280px;}
.spacer{flex:1;}
.list{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.member-row{
  display:grid; grid-template-columns: 1.3fr 0.8fr 1fr 0.8fr 72px;
  gap:12px; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border-soft);
  cursor:pointer; text-align:center;
}
.member-row > div:first-child{text-align:center;}
.member-row:last-child{border-bottom:none;}
.member-row:hover{background:var(--surface);}
.member-row.head{cursor:default; color:var(--text-faint); font-size:12px; background:var(--surface);}
.member-row.head:hover{background:var(--surface);}
.member-row.head > div:last-child, .member-row > div:last-child{text-align:right;}
.cell-name{font-weight:600;}
.cell-dim{color:var(--text-dim); font-size:13px;}
.record-row{
  display:grid; grid-template-columns:1fr 1fr 1fr auto;
  gap:12px; align-items:center; padding:13px 18px; border-bottom:1px solid var(--border-soft); cursor:pointer;
}
.record-row:last-child{border-bottom:none;}
.record-row:hover{background:var(--surface);}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.stat{display:flex; flex-direction:column; gap:4px;}
.stat .k{font-size:12px; color:var(--text-dim);}
.stat .v{font-size:19px; font-weight:700;}
.chart-stat-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
.chart-stat-top .k{font-size:12px; color:var(--text-dim);}
.chart-stat-top .chart-latest{font-size:15px; font-weight:700;}
.chart-stat-foot{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-faint); margin-top:2px;}
.sparkline-empty{font-size:12px; color:var(--text-faint); padding:6px 0;}
.section-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; margin:0 0 12px;}
.two-col{display:grid; grid-template-columns:1fr 1.5fr; gap:24px; align-items:start;}
.stack{display:flex; flex-direction:column; gap:20px;}
hr.div{border:none; border-top:1px solid var(--border); margin:24px 0;}

/* ---------- tabs (member detail: 체크 기록 / 변화 분석) ---------- */
.tab-bar{display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--border);}
.tab-btn{
  background:none; border:none; color:var(--text-dim); font-family:var(--font); font-size:13.5px;
  padding:10px 4px; cursor:pointer; border-bottom:2px solid transparent; margin-right:14px;
}
.tab-btn.active{color:var(--text); border-bottom-color:var(--accent); font-weight:700;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ---------- movement eval item ---------- */
.eval-item{padding:14px 0; border-bottom:1px solid var(--border-soft);}
.eval-item:last-child{border-bottom:none;}
.eval-top{display:flex; align-items:center; justify-content:space-between;}
.eval-name{font-weight:600; font-size:14px;}
.eval-desc{color:var(--text-dim); font-size:12px; margin-top:2px;}
.counter{display:flex; align-items:center; gap:10px;}
.counter button{
  width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); cursor:pointer; font-size:14px;
}
.counter .val{width:16px; text-align:center; font-weight:700;}

/* ---------- tags ---------- */
.tag-toggle{
  display:inline-flex; align-items:center; padding:7px 13px; border-radius:20px;
  border:1px solid var(--border); color:var(--text-dim); font-size:12.5px; cursor:pointer; margin:0 8px 8px 0;
}
.tag-toggle.on{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
.checklist-group{margin-bottom:18px;}
.checklist-group .gtitle{font-size:13px; font-weight:700; margin-bottom:8px;}
.chk-row{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13.5px; color:var(--text-dim);}
.chk-row input{accent-color:var(--accent);}

/* ---------- compare table ---------- */
.compare-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.compare-table th, .compare-table td{padding:10px 12px; border-bottom:1px solid var(--border-soft); text-align:left;}
.compare-table th{color:var(--text-dim); font-weight:600; font-size:12px;}
.delta-up{color:#7fd68a;}
.delta-down{color:#e08a7a;}
.delta-flat{color:var(--text-faint);}

/* ---------- empty ---------- */
.empty{padding:60px 20px; text-align:center; color:var(--text-dim);}

/* ---------- check record vertical form (mirrors original checkday_1.html, dark) ---------- */
.section-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:18px;}
.section-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.section-badge{
  width:24px; height:24px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-dim); flex-shrink:0;
}
.section-head-title{font-weight:700; font-size:15px;}
.section-head-sub{font-size:11.5px; color:var(--text-faint); margin-left:auto; white-space:nowrap;}
.progress-wrap{margin-top:18px;}
.progress-top{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
.progress-score{font-size:15px; font-weight:700;}
.progress-pill{font-size:11px; color:var(--text-faint); border:1px solid var(--border); border-radius:20px; padding:2px 9px;}
.progress-track{height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); width:0%; transition:width .15s;}
.pill-btn{
  display:inline-flex; align-items:center; padding:8px 14px; border-radius:20px; border:1px solid var(--border);
  color:var(--text-dim); font-size:12.5px; cursor:pointer; margin:0 8px 8px 0;
}
.pill-btn.on{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}

/* logo mark reused */
.logo-mark{width:22px; height:22px;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="screen" id="screen-login">
  <div class="login-wrap">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <svg class="logo-mark" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#f3f1ee" stroke-width="1.4"/>
        <path d="M14 10v20M20 10v20" stroke="#f3f1ee" stroke-width="1.4"/>
        <path d="M25 12l7 16" stroke="var(--logo-coral)" stroke-width="1.4"/>
      </svg>
      <div style="font-weight:700; font-size:18px;">위아짐</div>
    </div>
    <div class="login-form">
      <div class="field"><label>아이디</label><input type="text" placeholder="아이디 입력"></div>
      <div class="field"><label>비밀번호</label><input type="password" placeholder="비밀번호 입력"></div>
      <button class="btn btn-primary" onclick="nav('screen-main')">로그인</button>
      <div style="text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:4px;">로그인 후에는 자동으로 로그인 상태가 유지돼요</div>
    </div>
  </div>
</section>

<!-- ============ MAIN ============ -->
<section class="screen active" id="screen-main">
  <header class="topbar">
    <div class="brand" onclick="nav('screen-main')">
      <svg class="logo-mark" width="22" height="22" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#f3f1ee" stroke-width="1.4"/>
        <path d="M14 10v20M20 10v20" stroke="#f3f1ee" stroke-width="1.4"/>
        <path d="M25 12l7 16" stroke="var(--logo-coral)" stroke-width="1.4"/>
      </svg>
      위아짐
    </div>
    <div class="topbar-right">
      <button class="link-btn" onclick="nav('screen-login')">로그아웃</button>
    </div>
  </header>
  <div class="main-wrap">
    <svg class="main-logo" width="56" height="56" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19" stroke="#f3f1ee" stroke-width="1.2"/>
      <path d="M14 10v20M20 10v20" stroke="#f3f1ee" stroke-width="1.2"/>
      <path d="M25 12l7 16" stroke="var(--logo-coral)" stroke-width="1.2"/>
    </svg>
    <div class="main-title">Check Day</div>
    <div class="main-actions">
      <button class="btn" onclick="nav('screen-check-form'); resetCheckForm();">체크기록 작성</button>
      <button class="btn" onclick="nav('screen-member-list'); renderMemberList();">회원 관리</button>
    </div>
  </div>
</section>

<!-- ============ MEMBER LIST ============ -->
<section class="screen" id="screen-member-list">
  <header class="topbar">
    <div class="brand" onclick="nav('screen-main')">
      <svg class="logo-mark" width="22" height="22" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#f3f1ee" stroke-width="1.4"/><path d="M14 10v20M20 10v20" stroke="#f3f1ee" stroke-width="1.4"/><path d="M25 12l7 16" stroke="var(--logo-coral)" stroke-width="1.4"/></svg>
      위아짐
    </div>
    <div class="topbar-right">
      <span class="crumb">회원 관리</span>
      <button class="link-btn" onclick="nav('screen-login')">로그아웃</button>
    </div>
  </header>
  <div class="container">
    <div class="page-head">
      <div>
        <div class="page-title">회원 관리</div>
        <div class="page-sub">등록된 회원을 검색하고, 새 회원을 등록하거나 정보를 조회할 수 있어요</div>
      </div>
      <button class="btn btn-primary" onclick="startCreateMember()">+ 회원 정보 생성</button>
    </div>
    <div class="toolbar">
      <input type="search" placeholder="이름으로 검색" oninput="renderMemberList(this.value)">
    </div>
    <div class="list" id="member-list-body"></div>
  </div>
</section>

<!-- ============ MEMBER DETAIL ============ -->
<section class="screen" id="screen-member-detail">
  <header class="topbar">
    <div class="brand" onclick="nav('screen-main')">
      <svg class="logo-mark" width="22" height="22" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#f3f1ee" stroke-width="1.4"/><path d="M14 10v20M20 10v20" stroke="#f3f1ee" stroke-width="1.4"/><path d="M25 12l7 16" stroke="var(--logo-coral)" stroke-width="1.4"/></svg>
      위아짐
    </div>
    <div class="topbar-right">
      <button class="link-btn" onclick="nav('screen-member-list'); renderMemberList();">← 회원 관리</button>
      <button class="link-btn" onclick="nav('screen-login')">로그아웃</button>
    </div>
  </header>
  <div class="container">
    <div class="page-head">
      <div>
        <div class="page-title" id="md-name">-</div>
        <div class="page-sub" id="md-sub">-</div>
      </div>
      <button class="btn btn-ghost" onclick="startEditMember(state.currentMemberId)">편집</button>
    </div>

    <div class="two-col">
      <div class="stack">
        <div class="card">
          <div class="section-title">회원 정보</div>
          <div class="stack" style="gap:10px;">
            <div class="stat"><span class="k">이름</span><span class="v" id="md-name2" style="font-size:14px;">-</span></div>
            <div class="stat"><span class="k">성별</span><span class="v" id="md-gender" style="font-size:14px;">-</span></div>
            <div class="stat"><span class="k">담당 트레이너</span><span class="v" id="md-trainer" style="font-size:14px;">-</span></div>
          </div>
        </div>
        <div class="card">
          <div class="section-title">통계 · 전체 회차 누적</div>
          <div class="stack" style="gap:16px;" id="stat-charts"></div>
        </div>
      </div>

      <div class="stack">
        <div>
          <div class="tab-bar">
            <button class="tab-btn active" id="tab-btn-records" onclick="switchDetailTab('records')">체크 기록</button>
            <button class="tab-btn" id="tab-btn-compare" onclick="switchDetailTab('compare')">변화 분석</button>
          </div>

          <div class="tab-panel active" id="tab-panel-records">
            <div class="page-head" style="margin-bottom:12px;">
              <div></div>
              <button class="btn btn-sm" onclick="nav('screen-check-form'); resetCheckForm(true);">+ 체크기록 작성</button>
            </div>
            <div class="list" id="md-records"></div>
          </div>

          <div class="tab-panel" id="tab-panel-compare">
            <div class="page-head" style="margin-bottom:12px;">
              <div></div>
              <button class="btn btn-ghost btn-sm" onclick="openRecordView(state.formRecordId)">편집</button>
            </div>
            <div class="card" style="margin-bottom:16px;">
              <div class="grid-2">
                <div class="field">
                  <label>현재 체크기록</label>
                  <select id="cmp-current" onchange="renderCompare()"></select>
                </div>
                <div class="field">
                  <label>비교 대상</label>
                  <select id="cmp-target" onchange="renderCompare()"></select>
                </div>
              </div>
            </div>
            <div class="card">
              <div id="compare-table-wrap"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ MEMBER EDIT / CREATE (shared) ============ -->
<section class="screen" id="screen-member-edit">
  <header class="topbar">
    <div class="brand" onclick="nav('screen-main')">
      <svg class="logo-mark" width="22" height="22" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#f3f1ee" stroke-width="1.4"/><path d="M14 10v20M20 10v20" stroke="#f3f1ee" stroke-width="1.4"/><path d="M25 12l7 16" stroke="var(--logo-coral)" stroke-width="1.4"/></svg>
      위아짐
    </div>
    <div class="topbar-right">
      <button class="link-btn" onclick="cancelMemberEdit()">← 취소</button>
      <button class="link-btn" onclick="nav('screen-login')">로그아웃</button>
    </div>
  </header>
  <div class="container-narrow" style="max-width:480px;">
    <div class="page-title" style="margin-bottom:20px;" id="me-title">회원 정보 편집</div>
    <div class="stack" style="gap:14px;">
      <div class="field"><label>이름</label><input type="text" id="me-name" placeholder="회원 이름"></div>
      <div class="field">
        <label>성별</label>
        <select id="me-gender">
          <option value="">선택 안 함</option>
          <option value="여">여</option>
          <option value="남">남</option>
        </select>
      </div>
      <div class="field"><label>담당 트레이너</label><input type="text" id="me-trainer"></div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn btn-primary" onclick="saveMemberEdit()">저장</button>
        <button class="btn btn-ghost" onclick="cancelMemberEdit()">취소</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ CHECK RECORD (실제 원본 파일을 iframe으로 그대로 로드) ============ -->
<!-- 새 기록 작성 / 과거 기록 조회·편집 모두 이 화면 하나를 씀. 실제 폼은 checkday-record-form.html(업로드해주신 원본) 그대로. -->
<section class="screen" id="screen-check-form">
  <header class="topbar">
    <div class="brand" onclick="nav('screen-main')">
      <svg class="logo-mark" width="22" height="22" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#f3f1ee" stroke-width="1.4"/><path d="M14 10v20M20 10v20" stroke="#f3f1ee" stroke-width="1.4"/><path d="M25 12l7 16" stroke="var(--logo-coral)" stroke-width="1.4"/></svg>
      위아짐
    </div>
    <div class="topbar-right">
      <span class="crumb" id="cf-crumb">체크기록 작성</span>
      <button class="link-btn" onclick="nav('screen-login')">로그아웃</button>
    </div>
  </header>
  <iframe id="check-frame" src="" style="width:100%; height:calc(100vh - 73px); border:none; display:block; background:var(--bg);"></iframe>
</section>

<script>
/* ============================================================
   MOCK DATA
   ============================================================ */
const MOVEMENT_ITEMS = [
  {name:"호흡 테스트", desc:"늑골 · 복압 평가"},

/* ============================================================

/* ============================================================

function renderMemberList(filter){
  filter = (filter||"").trim();
  const body = document.getElementById('member-list-body');
  const rows = members.filter(m=>m.name.includes(filter));
  let html = `<div class="member-row head"><div>이름</div><div>성별</div><div>담당 트레이너</div><div>체크 횟수</div><div></div></div>`;
  if(rows.length===0){
    html += `<div class="empty">검색 결과가 없어요</div>`;
  } else {
    rows.forEach(m=>{
      html += `<div class="member-row" onclick="openMember(${m.id})">
        <div class="cell-name">${m.name}</div>
        <div class="cell-dim">${m.gender||'-'}</div>
        <div class="cell-dim">${m.trainer||'-'}</div>
        <div class="cell-dim">${m.records.length}회</div>
        <div><button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); deleteMember(${m.id})">제거</button></div>
      </div>`;
    });
  }
  body.innerHTML = html;
}
function deleteMember(id){
  members = members.filter(m=>m.id!==id);

}

  document.getElementById('me-name').value = "";

function startEditMember(id){

  state.currentMemberId = id;
  const m = members.find(x=>x.id===id);
  document.getElementById('me-title').textContent = "회원 정보 편집";

function saveMemberEdit(){
  const name = document.getElementById('me-name').value.trim() || "새 회원";
  const gender = document.getElementById('me-gender').value;
  const trainer = document.getElementById('me-trainer').value.trim();

  if(state.editMode==='create'){
    // only written to the members array on save — cancel never creates anything
    const m = {id:nextMemberId++, name, gender, trainer, records:[]};
    members.unshift(m);
    state.draftMember = null;
    renderMemberList();
    openMember(m.id);
  } else {
    const m = members.find(x=>x.id===state.currentMemberId);
    m.name = name; m.gender = gender; m.trainer = trainer;
    openMember(m.id);
  }
}
function cancelMemberEdit(){
  if(state.editMode==='create'){
    // discard the draft — nothing was ever added to `members`
    state.draftMember = null;
    nav('screen-member-list');
    renderMemberList();
  } else {
    openMember(state.currentMemberId);
  }
}

function deltaLabel(v, unit){
  const cls = v>0 ? "delta-up" : v<0 ? "delta-down" : "delta-flat";
  const arrow = v>0?"▲":v<0?"▼":"–";
  return `<span class="${cls}">${arrow} ${Math.abs(v).toFixed(1)}${unit}</span>`;
}

/* ---------- 통계: 전체 회차 누적 라인그래프 ---------- */
const STAT_METRICS = [
  {key:'fatPct', label:'체지방률 변화', unit:'%'},
  {key:'weight', label:'체중 변화', unit:'kg'},
  {key:'skm', label:'골격근량 변화', unit:'kg'},
  {key:'fatKg', label:'체지방량 변화', unit:'kg'},
];
function sparkline(values, unit){
  const w=260, h=68, padX=10, padTop=20, padBottom=16;
  if(values.length===0) return `<div class="sparkline-empty">체크기록이 없어요</div>`;
  if(values.length===1) return `<div class="sparkline-empty">${values[0]}${unit} · 첫 회차만 기록됨</div>`;
  const min=Math.min(...values), max=Math.max(...values);
  const range=(max-min)||1; // 값이 전부 같으면 평평한 직선 — 실제로 변화가 없었다는 뜻
  const innerH = h-padTop-padBottom;
  const stepX=(w-2*padX)/(values.length-1);
  const pts=values.map((v,i)=>[padX+i*stepX, padTop+innerH*(1-(v-min)/range)]);
  const poly=pts.map(p=>p.join(',')).join(' ');
  const dots=pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="var(--accent)"/>`).join('');
  // 각 지점 위(꼭대기에 가까우면 아래)에 실제 수치를 라벨로 표시 — 중간값도 그래프만 봐도 바로 읽히도록
  const labels = pts.map(([x,y], i)=>{
    const nearTop = y < padTop + 10;
    const ly = nearTop ? y + 13 : y - 8;
    return `<text x="${x}" y="${ly}" font-size="9.5" text-anchor="middle" fill="var(--text-dim)">${values[i]}</text>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block; max-width:100%;">
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${labels}
  </svg>`;
}
function renderStatCharts(m){
  const wrap = document.getElementById('stat-charts');
  if(m.records.length===0){
    wrap.innerHTML = `<div class="sparkline-empty">아직 체크기록이 없어요</div>`;
    return;
  }
  wrap.innerHTML = STAT_METRICS.map(metric=>{
    const values = m.records.map(r=>r[metric.key]);
    const first = values[0], last = values[values.length-1];
    const totalDelta = values.length>1 ? deltaLabel(last-first, metric.unit) : '';
    return `
      <div class="chart-stat">
        <div class="chart-stat-top">
          <span class="k">${metric.label}</span>
          <span class="chart-latest">${last}${metric.unit} ${totalDelta}</span>
        </div>
        ${sparkline(values, metric.unit)}
        <div class="chart-stat-foot"><span>${m.records[0].session}</span><span>${m.records[m.records.length-1].session}</span></div>
      </div>`;
  }).join('');
}

/* ---------- tabs: 체크 기록 / 변화 분석 ---------- */
function switchDetailTab(tab){
  document.getElementById('tab-btn-records').classList.toggle('active', tab==='records');
  document.getElementById('tab-btn-compare').classList.toggle('active', tab==='compare');
  document.getElementById('tab-panel-records').classList.toggle('active', tab==='records');
  document.getElementById('tab-panel-compare').classList.toggle('active', tab==='compare');
  if(tab==='compare') renderCompare();
}
function openRecordView(recordId){
  // 회차(날짜)를 고르면 그 회차에 작성했던 체크기록 전체를 원본 폼 그대로, 전체 화면으로 보여준다.
  // '변화 분석'과는 다른 화면 — 여기는 한 회차의 기록 자체를 보여주는 용도.
  const m = members.find(x=>x.id===state.currentMemberId);
  const r = m.records.find(x=>x.id===recordId);
  state.formMode = 'edit';
  state.formMemberId = m.id;
  state.formRecordId = r.id;
  document.getElementById('cf-crumb').textContent = `체크기록 · ${r.session}`;
  document.getElementById('check-frame').src = 'checkday-record-form.html?record=' + encodeRecordPayload(recordToPayload(m, r));
  nav('screen-check-form');
}
/* 저장된 record(내부 데이터) → 원본 폼이 이해하는 payload 형태로 변환.
   payload.raw가 있으면(직접 그 폼에서 저장한 경우) 그대로 쓰고,
   없으면(초기 목업 데이터처럼 raw가 없는 경우) 최소한의 필드만 채워 넣는다. */
function recordToPayload(member, record){
  if(record.raw) return record.raw;
  return {
    name: member.name, session: record.session, trainer: member.trainer,
    ib: { w:record.weight, m:record.skm, fat:record.fatKg, bmi:record.bmi, bfp:record.fatPct, bmr:record.bmr, vis:record.visceral },
    ibComment:'', scores: record.moves, evalData:[], goals:[], goalMemo:'', feedbacks:[], consultMemo:'',
  };
}
function encodeRecordPayload(payload){
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function prepareCompareSelects(){
  const m = members.find(x=>x.id===state.currentMemberId);
  const curSel = document.getElementById('cmp-current');
  const tgtSel = document.getElementById('cmp-target');
  if(m.records.length===0){
    curSel.innerHTML = tgtSel.innerHTML = `<option>체크기록 없음</option>`;
    document.getElementById('compare-table-wrap').innerHTML = `<div class="empty">비교할 체크기록이 없어요</div>`;
    return;
  }
  const opts = m.records.map(r=>`<option value="${r.id}">${r.session} (${r.date})</option>`).join("");
  curSel.innerHTML = opts;
  tgtSel.innerHTML = opts;
  curSel.value = m.records[m.records.length-1].id;
  tgtSel.value = m.records[0].id; // 비교 대상 기본값 = 첫 체크기록
}
function renderCompare(){
  const m = members.find(x=>x.id===state.currentMemberId);
  if(!m || m.records.length===0) return;
  const cur = m.records.find(r=>r.id==document.getElementById('cmp-current').value);
  const tgt = m.records.find(r=>r.id==document.getElementById('cmp-target').value);
  if(!cur || !tgt) return;
  state.formRecordId = cur.id; // record targeted by the 편집 link
  const rows = [
    ["체중 (kg)", tgt.weight, cur.weight, "kg"],
    ["골격근량 (kg)", tgt.skm, cur.skm, "kg"],
    ["체지방량 (kg)", tgt.fatKg, cur.fatKg, "kg"],
    ["체지방률 (%)", tgt.fatPct, cur.fatPct, "%"],
    ["BMI", tgt.bmi, cur.bmi, ""],
    ["기초대사량 (kcal)", tgt.bmr, cur.bmr, "kcal"],
    ["내장지방 레벨", tgt.visceral, cur.visceral, ""],
  ];
  let html = `<table class="compare-table"><thead><tr><th>항목</th><th>${tgt.session}</th><th>${cur.session}</th><th>변화</th></tr></thead><tbody>`;
  rows.forEach(([label,a,b,unit])=>{
    html += `<tr><td>${label}</td><td>${a}${unit}</td><td>${b}${unit}</td><td>${deltaLabel(b-a, unit)}</td></tr>`;
  });
  html += `</tbody></table><hr class="div"><div class="section-title">움직임 평가 총점</div><table class="compare-table"><tbody>`;
  MOVEMENT_ITEMS.forEach((item,i)=>{
    const a = tgt.moves[i], b = cur.moves[i];
    html += `<tr><td>${item.name}</td><td>${a}/3</td><td>${b}/3</td><td>${deltaLabel(b-a,"")}</td></tr>`;
  });
  const totalA = tgt.moves.reduce((a,b)=>a+b,0), totalB = cur.moves.reduce((a,b)=>a+b,0);
  html += `<tr style="font-weight:700;"><td>총점</td><td>${totalA}/24</td><td>${totalB}/24</td><td>${deltaLabel(totalB-totalA,"")}</td></tr>`;
  html += `</tbody></table>`;
  document.getElementById('compare-table-wrap').innerHTML = html;
}
/* ============================================================
   CHECK RECORD FORM — 실제 원본 파일(checkday-record-form.html)을
   iframe으로 그대로 띄우고, postMessage로 데이터를 주고받는다.
   ============================================================ */
function resetCheckForm(withPresetMember){
  // 메인/회원상세에서 "체크기록 작성"을 누른 경우 — 새 기록
  state.formMode = 'create';
  state.formMemberId = (withPresetMember && state.currentMemberId) ? state.currentMemberId : null;
  document.getElementById('cf-crumb').textContent = "체크기록 작성";
  let src = 'checkday-record-form.html';
  if(state.formMemberId){
    const m = members.find(x=>x.id===state.formMemberId);
    src += `?name=${encodeURIComponent(m.name)}&trainer=${encodeURIComponent(m.trainer||'정지훈')}`;
  }
  document.getElementById('check-frame').src = src;
}

/* 원본 폼이 저장 버튼을 누르면 postMessage로 이 데이터를 전달한다 */
function buildRecordFromPayload(payload){
  const ib = payload.ib || {};
  return {
    session: payload.session || "새 회차",
    weight: parseFloat(ib.w)||0,
    skm: parseFloat(ib.m)||0,
    fatKg: parseFloat(ib.fat)||0,
    fatPct: parseFloat(ib.bfp)||0,
    bmi: parseFloat(ib.bmi)||0,
    bmr: parseFloat(ib.bmr)||0,
    visceral: parseFloat(ib.vis)||0,
    moves: payload.scores || [0,0,0,0,0,0,0,0],
    raw: payload, // 원본 폼의 전체 내용(체크항목, 목표태그, 동작피드백, 메모 등) 그대로 보관 → 나중에 그대로 재현 가능
  };
}
window.addEventListener('message', (e)=>{
  if(!e.data || e.data.type !== 'checkday-save') return;
  const payload = e.data.payload;

  if(state.formMode === 'create'){
    // 회원상세에서 들어왔으면 그 회원으로 고정, 메인에서 바로 들어왔으면 입력한 이름으로 회원을 찾는다
    const member = state.formMemberId
      ? members.find(x=>x.id===state.formMemberId)
      : members.find(x=>x.name === (payload.name||'').trim());
    if(!member){
      alert('일치하는 회원을 찾을 수 없어요. 회원 관리에서 먼저 회원을 등록해 주세요.');
      return;
    }
    const record = buildRecordFromPayload(payload);
    record.id = nextRecordId++;
    record.date = new Date().toISOString().slice(0,10);
    member.records.push(record);
    openMember(member.id);
  } else if(state.formMode === 'edit'){
    const member = members.find(x=>x.id===state.formMemberId);
    const record = member.records.find(x=>x.id===state.formRecordId);
    if(!member || !record) return;
    Object.assign(record, buildRecordFromPayload(payload));
    openMember(member.id);
  }
});

/* init */
renderMemberList();
