<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체크기록 조회 — 위아짐 체크데이</title>
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/font.css" />
    <link rel="stylesheet" href="styles/layout-shell.css" />
    <link rel="stylesheet" href="styles/layout-check-doc-view.css" />
  </head>
  <body>
    <!-- 파일 용도: 체크기록 조회 화면 — ?docID= 로 저장된 기록 1건을 읽기 전용으로 조회한다 -->
    <div class="container">
      <app-header logout crumb="체크기록 조회">
        <app-gnb></app-gnb>
        <app-help>
          <h4>체크기록 조회</h4>
          <p>
            저장된 체크기록 1건을 읽기 전용으로 확인합니다. 응답 및 점수 수정은
            편집 화면에서 가능합니다.
          </p>
        </app-help>
      </app-header>

      <main>
        <!-- 기록 헤더 -->
        <section class="view-head" aria-label="기록 요약">
          <h1 class="vh-title" id="vh-title">체크기록</h1>
          <div class="vh-meta" id="vh-meta"></div>
        </section>

        <!-- 인바디 -->
        <section class="view-section" aria-label="인바디 결과">
          <h2 class="vs-title">인바디</h2>
          <div class="ib-grid" id="ib-grid"></div>
          <p class="ib-comment" id="ib-comment"></p>
        </section>

        <!-- 움직임 평가 -->
        <section class="view-section" aria-label="움직임 평가">
          <h2 class="vs-title">
            움직임 평가 <span class="vs-total" id="evals-total"></span>
          </h2>
          <div class="eval-list" id="eval-list"></div>
        </section>

        <!-- 목표 -->
        <section class="view-section" aria-label="운동 목표">
          <h2 class="vs-title">운동 목표</h2>
          <div class="goal-chips" id="goal-chips"></div>
          <p class="goal-memo" id="goal-memo"></p>
        </section>

        <!-- 동작 피드백 -->
        <section class="view-section" aria-label="동작 피드백">
          <h2 class="vs-title">동작 피드백</h2>
          <div class="fb-views" id="fb-views"></div>
        </section>

        <!-- 종합 상담 메모 -->
        <section class="view-section" aria-label="종합 상담 메모">
          <h2 class="vs-title">종합 상담 메모</h2>
          <p class="consult-memo" id="consult-memo"></p>
        </section>

        <div class="view-actions">
          <button type="button" class="btn btn-ghost" id="btn-back">
            이전으로
          </button>
          <a class="btn btn-primary" id="btn-edit" href="check-doc-edit.html"
            >수정하기</a
          >
        </div>
      </main>
    </div>

    <script type="module" src="scripts/check-doc-view.js"></script>
  </body>
</html>
