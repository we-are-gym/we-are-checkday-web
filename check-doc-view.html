<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="images/favicon.ico?v=2026081921" />
		<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png?v=2026081921" />
		<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=2026081921" />
		<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180x180.png?v=2026081921" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="체크기록 조회 — 위아짐 체크데이" />
		<meta property="og:description" content="그룹 트레이닝 격월 점검 · 회원별 움직임 평가와 상담 관리" />
		<meta property="og:image" content="images/og-image.png?v=2026081921" />
		<meta property="og:url" content="check-doc-view.html" />
		<title>체크기록 조회 — 위아짐 체크데이</title>
		<link rel="stylesheet" href="styles/colors.css?v=2026081921" />
		<link rel="stylesheet" href="styles/font.css?v=2026081921" />
		<link rel="stylesheet" href="styles/layout-shell.css?v=2026081921" />
		<link rel="stylesheet" href="styles/layout-check-doc-view.css?v=2026081921" />
	</head>
	<body>
		<!-- 파일 용도: 체크기록 조회 화면 — ?docID= 로 저장된 기록 1건을 읽기 전용으로 조회한다 -->
		<div class="container">
			<app-header crumb-path="index.html>홈|members.html>회원 관리|체크기록 조회"> </app-header>

			<main>
				<!-- 기록 헤더 -->
				<section class="view-head" aria-label="기록 요약">
					<h1 class="vh-title" id="vh-title">체크기록</h1>
					<div class="vh-meta" id="vh-meta"></div>
				</section>

				<!-- 인바디 -->
				<section class="view-section" aria-label="인바디 결과">
					<h2 class="vs-title">인바디</h2>
					<div class="ib-grid" id="ib-grid"></div>
					<p class="ib-comment" id="ib-comment"></p>
				</section>

				<!-- 움직임 평가 -->
				<section class="view-section" aria-label="움직임 평가">
					<h2 class="vs-title">움직임 평가 <span class="vs-total" id="evals-total"></span></h2>
					<div class="eval-list" id="eval-list"></div>
				</section>

				<!-- 목표 -->
				<section class="view-section" aria-label="운동 목표">
					<h2 class="vs-title">운동 목표</h2>
					<div class="goal-chips" id="goal-chips"></div>
					<p class="goal-memo" id="goal-memo"></p>
				</section>

				<!-- 동작 피드백 -->
				<section class="view-section" aria-label="동작 피드백">
					<h2 class="vs-title">동작 피드백</h2>
					<div class="fb-views" id="fb-views"></div>
				</section>

				<!-- 종합 상담 메모 -->
				<section class="view-section" aria-label="종합 상담 메모">
					<h2 class="vs-title">종합 상담 메모</h2>
					<p class="consult-memo" id="consult-memo"></p>
				</section>

				<div class="view-actions">
					<button type="button" class="btn btn-ghost" id="btn-back">이전으로</button>
					<a class="btn btn-primary" id="btn-edit" href="check-doc-edit.html">수정하기</a>
				</div>
			</main>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@infra/": "./ESM/infra/",
					"@tools/": "./ESM/tools/",
					"@calc/": "./ESM/calc/",
					"@gym/": "./ESM/gym/",
					"@member/": "./ESM/member/",
					"@shared/": "./ESM/shared/",
					"@check-doc/": "./ESM/check-doc/"
				}
			}
		</script>
		<script type="module" src="ESM/entries/check-doc-view.js?v=2026081921"></script>
		<script>
			window.__API_BASE__ = "https://checkday-rest-evztw4wu4q-du.a.run.app/api/v1";
		</script>
	</body>
</html>
