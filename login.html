<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 — 위아짐 체크데이</title>
    <link rel="stylesheet" href="styles/colors.css?v=2026080505" />
    <link rel="stylesheet" href="styles/font.css?v=2026080505" />
    <link rel="stylesheet" href="styles/layout-shell.css?v=2026080505" />
    <link rel="stylesheet" href="styles/layout-login.css?v=2026080505" />
  </head>
  <body>
    <!-- 파일 용도: 로그인 화면 — 데모 계정으로 로그인하면 세션에 상태 기록 후 redirect(기본 index.html)로 이동 -->
    <div class="container login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <span class="logo-mark" role="img" aria-label="위아짐 심볼"></span>
          <h1 class="login-title">위아짐</h1>
        </div>
        <div id="login-box"></div>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <!-- <p class="login-hint">데모 계정 — 아이디: checkday / 비밀번호: 1234</p> -->
      </div>
    </div>

    <script type="module" src="scripts/login.js?v=2026080505"></script>
  </body>
</html>
