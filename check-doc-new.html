<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체크기록 작성 — 위아짐 체크데이</title>
    <link rel="stylesheet" href="styles/colors.css" />
    <link rel="stylesheet" href="styles/font.css" />
    <link rel="stylesheet" href="styles/layout-shell.css" />
    <link rel="stylesheet" href="styles/layout-checkday.css" />
  </head>
  <body>
    <!-- 파일 용도: 체크데이 상담지 화면 — 그룹 트레이닝 격월 점검 · 회복 움직임 평가와 상담 기록 -->
    <div class="container">
      <app-header logout crumb="체크기록 작성" back="index.html">
        <!-- 네비게이션 삭제 -->
        <!-- <app-gnb></app-gnb> -->
        <!-- 내장 도움말 삭제 -->
        <!-- <app-help>
          <h4>체크기록 작성</h4>
          <p>
            ① 인바디 수치 입력 → ② 움직임 평가 8개 항목 점수(0–3)·체크·메모 → ③
            목표 선택 → ④ 동작 피드백 → ⑤ 저장 순서로 기록합니다.
          </p>
          <p>
            평가 카드의 +/− 버튼으로 점수를 조절하고, 항목명을 눌러 세부
            체크/메모를 펼칩니다.
          </p>
        </app-help> -->
      </app-header>
      <!-- 헤더 -->
      <div class="page-header">
        <div>
          <h1>체크데이 상담지</h1>
          <p>그룹 트레이닝 격월 점검 · 30분</p>
        </div>
        <div class="date-badge" id="date-badge"></div>
      </div>

      <!-- 회원 정보 -->
      <div class="member-bar">
        <div class="mf">
          <label>회원</label
          ><input
            id="m-member"
            type="text"
            list="member-list"
            placeholder="회원 이름 입력 또는 선택"
            autocomplete="off"
            aria-label="회원 이름 선택"
          />
          <datalist id="member-list"></datalist>
        </div>
        <div class="mf">
          <label>회원 이름</label
          ><input id="m-name" type="text" placeholder="홍길동" readonly />
        </div>
        <div class="mf">
          <label>회차</label
          ><input id="m-session" type="text" placeholder="2025-06 (2회차)" />
        </div>
        <div class="mf">
          <label>트레이너</label
          ><input id="m-trainer" type="text" placeholder="김지훈" />
        </div>
      </div>

      <!-- 움직임 총점 -->
      <div class="total-bar">
        <div class="tl">
          <div class="tl-label">움직임 총점</div>
          <div class="tl-num" id="total-num">0 <span>/ 24</span></div>
        </div>
        <div class="tr">
          <div class="prog-track">
            <div class="prog-fill" id="prog-fill" style="width: 0%"></div>
          </div>
          <div class="total-grade">
            <div
              class="grade-pill"
              id="grade-pill"
              style="background: var(--surface2); color: var(--text3)"
            >
              평가 전
            </div>
            <span class="grade-hint" id="grade-hint"></span>
          </div>
        </div>
      </div>

      <!-- ① 인바디 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">1</div>
          <div class="sec-title">인바디 확인</div>
          <div class="sec-sub">체성분 수치 입력</div>
        </div>
        <div class="card">
          <div class="ib-grid" id="ib-grid"></div>
          <!-- 내장지방 -->
          <div
            style="
              padding: 10px 13px;
              border-top: 0.5px solid var(--border);
              display: flex;
              align-items: center;
              gap: 12px;
            "
          >
            <div style="flex: 0 0 auto">
              <label
                style="
                  font-size: 10px;
                  font-weight: 600;
                  color: var(--text3);
                  display: block;
                  margin-bottom: 4px;
                  letter-spacing: 0.3px;
                "
                >내장지방 레벨</label
              >
              <input
                class="ib-num"
                id="ib-vis"
                type="number"
                placeholder="8"
                min="1"
                max="20"
                style="width: 70px"
              />
            </div>
            <div id="tag-vis" style="padding-top: 18px"></div>
          </div>
          <div class="ib-comment-row">
            <span class="ib-comment-lbl">코멘트</span>
            <textarea
              class="ib-comment"
              id="ib-comment"
              placeholder="지난 회차 대비 변화, 방향 코멘트 (예: 근육↑ 체지방↓ 유지 잘 됨)"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- ② 움직임 평가 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">2</div>
          <div class="sec-title">움직임 평가</div>
          <div class="sec-sub">8개 항목 · 각 0–3점</div>
        </div>
        <div class="card" id="eval-cards"></div>
      </div>

      <!-- ③ 다음 목표 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">3</div>
          <div class="sec-title">다음 목표 / 방향</div>
          <div class="sec-sub">태그 선택 + 메모</div>
        </div>
        <div class="card">
          <div class="goal-tags" id="goal-tags"></div>
          <div class="goal-memo-wrap">
            <textarea
              class="goal-memo"
              id="goal-memo"
              placeholder="구체적인 방향이나 다음 회차까지의 목표를 기록하세요..."
            ></textarea>
          </div>
        </div>
      </div>

      <!-- ④ 동작 피드백 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">4</div>
          <div class="sec-title">동작 피드백</div>
          <div class="sec-sub">동작 추가/삭제 가능</div>
        </div>
        <div class="card" id="fb-cards"></div>
        <button class="add-fb-btn">+ 동작 추가</button>
      </div>

      <!-- ⑤ 종합 상담 메모 -->
      <div class="section">
        <div class="sec-header">
          <div class="sec-num">5</div>
          <div class="sec-title">종합 상담 메모</div>
          <div class="sec-sub">특이사항 · 요청사항</div>
        </div>
        <div class="card">
          <textarea
            class="consult-memo"
            id="consult-memo"
            placeholder="부상 이력, 생활 패턴, 회원 요청, 다음 체크데이 주의사항 등..."
          ></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" data-action="reset">초기화</button>
        <button class="btn btn-ghost" data-action="report">📋 결과 보기</button>
        <button class="btn btn-primary" data-action="save">저장</button>
        <button class="btn btn-ghost" data-action="print">인쇄 / PDF</button>
      </div>
    </div>

    <!-- 결과 모달 -->
    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <div class="modal">
        <h3 id="overlay-title">체크데이 결과 요약</h3>
        <div id="report-body"></div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-action="close-modal">닫기</button>
          <button class="btn btn-primary" data-action="copy">
            텍스트 복사
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="scripts/checkday.js"></script>
  </body>
</html>
